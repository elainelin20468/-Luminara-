<!DOCTYPE html>
<html lang="zh-CN" data-lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="塔罗解读">
<meta name="theme-color" content="#060c18">
<meta name="mobile-web-app-capable" content="yes">
<title>韦特塔罗 · Waite Tarot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --night:#060c18;--night2:#0d1628;--night3:#152038;
  --silver:#c8d8e8;--silver2:#e0ecf8;
  --star-w:#fff;--star-g:#f8e888;--star-i:#a8d8f8;
  --bg:var(--night2);--sf:rgba(21,32,56,.92);--sf2:rgba(13,22,40,.96);
  --bd:rgba(168,216,248,.1);--bd2:rgba(168,216,248,.22);--bd3:rgba(168,216,248,.4);
  --tx:#e8f0f8;--tx2:#9ab8d0;--tx3:#5a7898;
  --good:#68c890;--warn:#e87858;--r:8px;--rl:16px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--night);color:var(--tx);font-family:'Noto Sans SC','Inter',sans-serif;font-size:16px;line-height:1.75;min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 80% 60% at 50% 0%,#1e3a6a 0%,transparent 65%),radial-gradient(ellipse 60% 40% at 20% 30%,#0d2a18 0%,transparent 55%),radial-gradient(ellipse 100% 50% at 50% 100%,#060c18 0%,#0a1828 100%);pointer-events:none;z-index:0}
body::after{content:'';position:fixed;inset:0;background-image:radial-gradient(1px 1px at 15% 12%,rgba(255,255,255,.9) 0%,transparent 100%),radial-gradient(1px 1px at 42% 8%,rgba(248,232,136,.8) 0%,transparent 100%),radial-gradient(2px 2px at 35% 5%,rgba(255,255,255,.95) 0%,transparent 100%),radial-gradient(1px 1px at 70% 15%,rgba(255,255,255,.7) 0%,transparent 100%),radial-gradient(1px 1px at 88% 6%,rgba(168,216,248,.8) 0%,transparent 100%),radial-gradient(2px 2px at 78% 18%,rgba(168,216,248,.9) 0%,transparent 100%),radial-gradient(1px 1px at 55% 22%,rgba(255,255,255,.5) 0%,transparent 100%),radial-gradient(1px 1px at 92% 30%,rgba(248,232,136,.6) 0%,transparent 100%);pointer-events:none;z-index:0}
.app{position:relative;z-index:2;max-width:800px;margin:0 auto;padding:0 16px 80px}

/* LANG */
.lang-btn{position:fixed;top:14px;right:14px;z-index:999;display:flex;gap:5px}
.lp{padding:4px 11px;border-radius:20px;border:1px solid var(--bd2);background:rgba(13,22,40,.88);font-family:'Cinzel',serif;font-size:10px;cursor:pointer;color:var(--tx2);transition:all .2s;backdrop-filter:blur(8px)}
.lp.on{border-color:var(--star-i);color:var(--silver2);background:rgba(168,216,248,.1)}

/* HEADER */
.hd{text-align:center;padding:62px 20px 36px;margin-bottom:24px;position:relative}
.hd::before{content:'✦';position:absolute;top:20px;left:50%;transform:translateX(-50%);font-size:26px;color:var(--star-w);text-shadow:0 0 8px #fff,0 0 20px rgba(168,216,248,.9),0 0 40px rgba(168,216,248,.5),4px 0 12px rgba(255,255,255,.6),-4px 0 12px rgba(255,255,255,.6),0 4px 12px rgba(255,255,255,.6),0 -4px 12px rgba(255,255,255,.6);animation:sP 3s ease-in-out infinite}
.hd::after{content:'✧         ✧';position:absolute;top:32px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--star-g);letter-spacing:4.5em;white-space:nowrap;text-shadow:0 0 8px rgba(248,232,136,.8);opacity:.7}
@keyframes sP{0%,100%{opacity:1;text-shadow:0 0 8px #fff,0 0 20px rgba(168,216,248,.9),0 0 40px rgba(168,216,248,.5),4px 0 16px rgba(255,255,255,.7),-4px 0 16px rgba(255,255,255,.7),0 4px 16px rgba(255,255,255,.7),0 -4px 16px rgba(255,255,255,.7)}50%{opacity:.75;text-shadow:0 0 4px #fff,0 0 10px rgba(168,216,248,.5),0 0 20px rgba(168,216,248,.3)}}
.hd-orn{font-size:10px;letter-spacing:.5em;color:var(--star-i);margin-bottom:14px;opacity:.75;text-transform:uppercase;font-family:'Cinzel',serif}
.hd-title{font-family:'Cinzel',serif;font-size:clamp(20px,5vw,34px);font-weight:700;color:var(--star-w);letter-spacing:.12em;margin-bottom:8px;text-shadow:0 0 20px rgba(168,216,248,.4),0 2px 12px rgba(0,0,0,.6)}
.hd-sub{font-size:14px;color:var(--tx2);font-style:italic}

/* SECTION LABEL */
.lbl{font-family:'Cinzel',serif;font-size:9px;letter-spacing:.22em;color:var(--tx3);text-transform:uppercase;margin-bottom:9px}

/* QUESTION */
.q-wrap{margin-bottom:18px}
.q-input{width:100%;background:var(--sf);border:1px solid var(--bd2);border-radius:var(--r);color:var(--tx);font-family:'Noto Sans SC','Inter',sans-serif;font-size:16px;padding:11px 15px;outline:none;transition:border-color .25s,box-shadow .25s;backdrop-filter:blur(8px)}
.q-input::placeholder{color:var(--tx3);font-style:italic}
.q-input:focus{border-color:var(--bd3);box-shadow:0 0 0 3px rgba(168,216,248,.07),0 0 16px rgba(168,216,248,.1)}

/* CFG ROW */
.cfg-row{display:flex;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.cfg-g{flex:1;min-width:160px}
.pills{display:flex;gap:5px;flex-wrap:wrap}
.pill{padding:4px 12px;border-radius:20px;border:1px solid var(--bd2);background:transparent;font-size:12px;cursor:pointer;color:var(--tx2);font-family:'Noto Sans SC','Inter',sans-serif;transition:all .2s}
.pill:hover{border-color:var(--bd3);color:var(--tx)}
.pill.on{background:rgba(168,216,248,.1);border-color:var(--star-i);color:var(--silver2)}

/* SPREAD SELECTOR */
.spread-selector{margin-bottom:18px}
.spread-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:7px}
.s-card{padding:9px 11px;border:1px solid var(--bd2);border-radius:var(--r);background:transparent;cursor:pointer;transition:all .2s;text-align:left}
.s-card:hover{border-color:var(--bd3);background:rgba(168,216,248,.04)}
.s-card.on{border-color:var(--star-i);background:rgba(168,216,248,.1)}
.s-card-name{font-family:'Cinzel',serif;font-size:10px;color:var(--silver);display:block;margin-bottom:3px;letter-spacing:.05em}
.s-card-desc{font-size:10px;color:var(--tx3);display:block;line-height:1.4}
.s-card-n{font-size:9px;color:var(--star-g);display:block;margin-top:2px;font-family:'Cinzel',serif}

/* BUTTONS */
.btn-row{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
.btn{flex:1;min-width:100px;padding:10px 12px;border-radius:var(--r);font-family:'Cinzel',serif;font-size:10px;letter-spacing:.1em;cursor:pointer;transition:all .22s;border:none;display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn-p{background:linear-gradient(135deg,#0d2a48 0%,#1e4a70 50%,#0d3858 100%);color:var(--silver2);border:1px solid rgba(168,216,248,.3);box-shadow:0 2px 12px rgba(0,0,0,.4)}
.btn-p:hover{border-color:var(--star-i);box-shadow:0 4px 20px rgba(0,0,0,.5),0 0 12px rgba(168,216,248,.2);transform:translateY(-1px)}
.btn-s{background:transparent;border:1px solid var(--bd2);color:var(--tx2)}
.btn-s:hover{border-color:var(--bd3);color:var(--tx)}
.btn-g{background:linear-gradient(135deg,#3a2800,#6a4800);color:var(--star-g);border:1px solid rgba(248,232,136,.3)}
.btn-g:hover{border-color:var(--star-g);box-shadow:0 0 12px rgba(248,232,136,.2);transform:translateY(-1px)}

/* PICKER */
.picker-wrap{display:none;background:var(--sf2);border:1px solid var(--bd2);border-radius:var(--rl);padding:14px;margin-bottom:16px;backdrop-filter:blur(12px)}
.picker-wrap.show{display:block}
.picker-hd{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.p-search{flex:1;min-width:140px;background:rgba(6,12,24,.6);border:1px solid var(--bd);border-radius:var(--r);color:var(--tx);font-family:'Noto Sans SC','Inter',sans-serif;font-size:14px;padding:6px 11px;outline:none;transition:border-color .2s}
.p-search:focus{border-color:var(--bd3)}
.p-search::placeholder{color:var(--tx3)}
.ori-grp{display:flex;gap:4px}
.ot{padding:4px 10px;border-radius:20px;border:1px solid var(--bd2);background:transparent;font-size:11px;cursor:pointer;color:var(--tx2);font-family:'Cinzel',serif;transition:all .18s}
.ot:hover{border-color:var(--bd3);color:var(--tx)}
.ot.on{background:rgba(168,216,248,.1);border-color:var(--star-i);color:var(--silver2)}
.p-count{font-size:11px;color:var(--tx3);font-style:italic;white-space:nowrap}
.p-grid{display:flex;flex-wrap:wrap;gap:6px;max-height:320px;overflow-y:auto;padding:3px 0;scrollbar-width:thin;scrollbar-color:var(--bd2) transparent}
.p-grid::-webkit-scrollbar{width:4px}
.p-grid::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:2px}

/* 每张牌 — 图+名字+点击展开完整牌意 */
.pc{display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;padding:4px;border-radius:var(--r);border:1px solid transparent;transition:all .18s;position:relative;width:64px}
.pc:hover{border-color:var(--bd2);background:rgba(168,216,248,.04)}
.pc.sel{border-color:var(--star-g);background:rgba(248,232,136,.06)}
.pc img{width:44px;height:73px;object-fit:cover;border-radius:3px;display:block}
.pc-sym{width:44px;height:73px;background:var(--night3);border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:18px}
.pc-name{font-size:8px;color:var(--tx3);text-align:center;max-width:60px;line-height:1.25;font-family:'Cinzel',serif}
.pc-rv{font-size:7.5px;color:var(--star-i);font-style:italic;text-align:center}
.pc-sel-badge{position:absolute;top:2px;right:2px;background:var(--star-g);color:#1a1000;font-size:7px;padding:1px 3px;border-radius:3px;font-family:'Cinzel',serif;font-weight:700}

/* 牌意预览浮层 */
.pc-preview{display:none;position:absolute;top:0;left:68px;z-index:50;width:200px;background:rgba(10,18,34,.97);border:1px solid var(--bd2);border-radius:10px;padding:12px;box-shadow:0 8px 24px rgba(0,0,0,.7);pointer-events:none}
.pc:hover .pc-preview{display:block}
.pcpv-img{width:54px;height:90px;object-fit:cover;border-radius:4px;float:left;margin-right:10px;border:1px solid var(--bd2)}
.pcpv-name{font-family:'Cinzel',serif;font-size:11px;color:var(--silver2);margin-bottom:3px;font-weight:600}
.pcpv-keys{font-size:10px;color:var(--star-g);margin-bottom:6px;opacity:.85;line-height:1.4}
.pcpv-pos-lbl{font-family:'Cinzel',serif;font-size:8px;letter-spacing:.1em;color:var(--star-i);text-transform:uppercase;margin-bottom:2px}
.pcpv-pos{font-size:11px;color:var(--tx);line-height:1.5;margin-bottom:5px}
.pcpv-rev-lbl{font-family:'Cinzel',serif;font-size:8px;letter-spacing:.1em;color:var(--warn);text-transform:uppercase;margin-bottom:2px}
.pcpv-rev{font-size:11px;color:var(--tx2);line-height:1.5;margin-bottom:5px}
.pcpv-hook{font-size:10px;color:var(--tx3);font-style:italic;border-top:1px solid var(--bd);padding-top:5px;clear:both;margin-top:4px}
.pcpv-clear{clear:both}

.p-foot{display:flex;gap:7px;margin-top:12px;align-items:center;flex-wrap:wrap}
.p-confirm{padding:6px 16px;background:linear-gradient(135deg,#0d2a48,#1e4a70);color:var(--silver2);border:1px solid rgba(168,216,248,.3);border-radius:var(--r);font-family:'Cinzel',serif;font-size:10px;letter-spacing:.08em;cursor:pointer;font-weight:600;transition:all .2s}
.p-confirm:hover{border-color:var(--star-i)}
.p-clear{padding:6px 12px;background:transparent;border:1px solid var(--bd2);border-radius:var(--r);font-family:'Cinzel',serif;font-size:10px;cursor:pointer;color:var(--tx3);transition:all .2s}
.p-clear:hover{border-color:rgba(232,120,88,.5);color:var(--warn)}

/* SPREAD DISPLAY — 牌阵图形排列 */
.spread-display{margin-bottom:18px;display:none}
.spread-name-lbl{font-family:'Cinzel',serif;font-size:9px;color:var(--tx3);letter-spacing:.15em;text-align:center;margin-bottom:4px;text-transform:uppercase}

/* 牌阵信息横幅 */
.spread-info-bar{background:rgba(6,12,24,.5);border:1px solid var(--bd);border-radius:var(--r);padding:10px 14px;margin-bottom:14px;display:flex;align-items:flex-start;gap:12px}
.spread-info-icon{font-size:20px;flex-shrink:0;margin-top:1px}
.spread-info-body{}
.spread-info-name{font-family:'Cinzel',serif;font-size:12px;color:var(--silver2);margin-bottom:3px;letter-spacing:.06em}
.spread-info-desc{font-size:13px;color:var(--tx2);line-height:1.5;margin-bottom:3px}
.spread-info-ref{font-size:11px;color:var(--tx3);font-style:italic}
.spread-info-pos{margin-top:7px;display:flex;flex-wrap:wrap;gap:4px}
.spread-pos-tag{padding:2px 7px;border:1px solid var(--bd2);border-radius:20px;font-size:9px;color:var(--tx3);font-family:'Cinzel',serif;letter-spacing:.04em}
.spread-pos-tag span{color:var(--star-g);margin-right:2px}

/* 通用flex布局 */
.ic-wrap{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;padding:4px 0 10px}

/* 三牌阵 */
.layout-three .ic-wrap{flex-wrap:nowrap;justify-content:center;gap:16px}

/* 凯尔特十字 — 标准位置，中心十字+右侧四张 */
.layout-cross .ic-wrap{
  display:grid;
  grid-template-columns:80px 80px 80px 20px 80px;
  grid-template-rows:auto auto auto auto auto;
  gap:4px;
  justify-content:center;
  align-items:start;
}
.layout-cross .ic:nth-child(1){grid-column:2;grid-row:2}
.layout-cross .ic:nth-child(2){grid-column:3;grid-row:2}
.layout-cross .ic:nth-child(3){grid-column:2;grid-row:3}
.layout-cross .ic:nth-child(4){grid-column:2;grid-row:1}
.layout-cross .ic:nth-child(5){grid-column:1;grid-row:2}
.layout-cross .ic:nth-child(6){grid-column:2;grid-row:4}
.layout-cross .ic:nth-child(7){grid-column:5;grid-row:4}
.layout-cross .ic:nth-child(8){grid-column:5;grid-row:3}
.layout-cross .ic:nth-child(9){grid-column:5;grid-row:2}
.layout-cross .ic:nth-child(10){grid-column:5;grid-row:1}

/* 四元素 — 2×2 */
.layout-four .ic-wrap{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:220px;margin:0 auto}

/* 二选一 — A/B两列带标签 */
.layout-choice .ic-wrap{display:flex;gap:24px;justify-content:center;align-items:flex-start;flex-wrap:nowrap}
.layout-choice .choice-col{display:flex;flex-direction:column;align-items:center;gap:8px}
.choice-col-label{font-family:"Cinzel",serif;font-size:11px;color:var(--star-g);letter-spacing:.12em;padding:3px 14px;border:1px solid rgba(248,232,136,.25);border-radius:20px;margin-bottom:2px}
.choice-divider{width:1px;background:linear-gradient(to bottom,transparent,var(--bd2) 30%,var(--bd2) 70%,transparent);align-self:stretch;flex-shrink:0;min-height:100px;margin-top:28px}

/* 生命之树 — 卡巴拉三柱标准布局 */
.layout-tree .ic-wrap{
  display:grid;
  grid-template-columns:80px 80px 80px;
  grid-template-rows:repeat(7,auto);
  gap:4px;
  justify-content:center;
}
.layout-tree .ic:nth-child(1){grid-column:2;grid-row:1}   /* Kether — 王冠 */
.layout-tree .ic:nth-child(2){grid-column:3;grid-row:2}   /* Chokmah — 智慧 */
.layout-tree .ic:nth-child(3){grid-column:1;grid-row:2}   /* Binah — 理解 */
.layout-tree .ic:nth-child(4){grid-column:3;grid-row:3}   /* Chesed — 仁慈 */
.layout-tree .ic:nth-child(5){grid-column:1;grid-row:3}   /* Geburah — 严厉 */
.layout-tree .ic:nth-child(6){grid-column:2;grid-row:4}   /* Tiphareth — 美丽 */
.layout-tree .ic:nth-child(7){grid-column:3;grid-row:5}   /* Netzach — 胜利 */
.layout-tree .ic:nth-child(8){grid-column:1;grid-row:5}   /* Hod — 光辉 */
.layout-tree .ic:nth-child(9){grid-column:2;grid-row:6}   /* Yesod — 基础 */
.layout-tree .ic:nth-child(10){grid-column:2;grid-row:7}  /* Malkuth — 王国 */

/* 关系阵 */
.layout-relationship .ic-wrap{display:flex;flex-direction:column;align-items:center;gap:10px}
.layout-relationship .ic-row{display:flex;gap:10px;justify-content:center}

/* 每张牌顶部的位置编号标签 */
.ic-num{position:absolute;top:-10px;left:50%;transform:translateX(-50%);background:rgba(6,12,24,.92);border:1px solid rgba(248,232,136,.3);border-radius:20px;font-family:"Cinzel",serif;font-size:7.5px;color:var(--star-g);padding:1px 7px;white-space:nowrap;z-index:5;letter-spacing:.04em;max-width:90px;overflow:hidden;text-overflow:ellipsis}
.ic{position:relative;margin-top:10px}
.ic{display:flex;flex-direction:column;align-items:center;width:76px;gap:0;cursor:pointer}
.ic-img{width:62px;height:104px;border-radius:5px;border:1px solid var(--bd2);background:var(--night3);position:relative;overflow:hidden;transition:transform .28s cubic-bezier(.22,.68,0,1.1),box-shadow .28s;box-shadow:0 4px 16px rgba(0,0,0,.6)}
.ic:hover .ic-img{transform:translateY(-5px) scale(1.04);border-color:rgba(168,216,248,.5);box-shadow:0 8px 28px rgba(0,0,0,.7),0 0 14px rgba(168,216,248,.18)}
.ic-img img{width:100%;height:100%;object-fit:cover;display:block;border-radius:4px}
.ic-img.rev img{transform:rotate(180deg)}
.ic-img .rb{position:absolute;bottom:2px;right:2px;background:rgba(6,12,24,.85);color:var(--star-g);font-size:7px;padding:1px 3px;border-radius:3px;font-family:'Cinzel',serif}
.ic-pos{font-family:'Cinzel',serif;font-size:8.5px;color:var(--tx3);letter-spacing:.06em;text-align:center;margin-top:4px;max-width:72px;line-height:1.3}
.ic-name{font-family:'Cinzel',serif;font-size:9px;color:var(--silver);text-align:center;font-weight:600;margin-top:2px;max-width:72px;line-height:1.3}
.ic-ori{font-size:8.5px;color:var(--tx3);text-align:center;font-style:italic;margin-top:1px}
.card-brief{background:rgba(13,22,40,.92);border:1px solid var(--bd);border-radius:7px;padding:8px 10px;margin-top:5px;display:none;backdrop-filter:blur(6px)}
.ic.expanded .card-brief{display:block}
.ic.expanded .ic-img{border-color:rgba(168,216,248,.4);box-shadow:0 5px 18px rgba(0,0,0,.65),0 0 10px rgba(168,216,248,.15)}
.cb-key{font-size:8.5px;color:var(--star-g);font-family:'Cinzel',serif;letter-spacing:.05em;margin-bottom:3px;opacity:.85}
.cb-txt{font-size:10px;color:var(--tx2);line-height:1.5}
.cb-hook{margin-top:4px;font-size:9px;color:var(--tx3);font-style:italic;line-height:1.4;border-top:1px solid var(--bd);padding-top:3px}
.ic-appear{animation:icA .5s cubic-bezier(.22,.68,0,1.15) forwards;opacity:0}
@keyframes icA{from{opacity:0;transform:translateY(18px) scale(.87);filter:blur(2px)}to{opacity:1;transform:none;filter:blur(0)}}

/* ADD BAR */
.add-bar{display:none;background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:9px 12px;margin-bottom:14px;gap:8px;flex-wrap:wrap;align-items:center;backdrop-filter:blur(8px)}
.add-bar.show{display:flex}
.add-bar input{flex:1;min-width:140px;background:transparent;border:none;color:var(--tx);font-family:'Noto Sans SC','Inter',sans-serif;font-size:15px;outline:none}
.add-bar input::placeholder{color:var(--tx3);font-style:italic}
.ab-div{width:1px;height:16px;background:var(--bd2);flex-shrink:0}
.mb{padding:4px 10px;border:1px solid var(--bd2);border-radius:20px;background:transparent;font-size:11px;cursor:pointer;color:var(--tx2);font-family:'Noto Sans SC','Inter',sans-serif;white-space:nowrap;transition:all .18s}
.mb:hover{border-color:var(--bd3);color:var(--tx)}

/* READING PANEL */
.rp{display:none;border:1px solid var(--bd);border-radius:var(--rl);background:var(--sf);overflow:hidden;backdrop-filter:blur(12px);box-shadow:0 4px 32px rgba(0,0,0,.5)}
.rp.show{display:block}
.rtabs{display:flex;border-bottom:1px solid var(--bd);overflow-x:auto;scrollbar-width:none;background:rgba(6,12,24,.6)}
.rtabs::-webkit-scrollbar{display:none}
.rtab{padding:10px 15px;font-size:10px;color:var(--tx3);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:color .2s;font-family:'Cinzel',serif;letter-spacing:.1em;flex-shrink:0}
.rtab:hover{color:var(--tx2)}
.rtab.on{color:var(--silver2);border-bottom-color:var(--star-i)}
.rc{padding:20px;min-height:120px}
.rph{text-align:center;padding:28px;color:var(--tx3);font-style:italic;font-size:14px}
.s-div{text-align:center;margin-bottom:14px;font-size:11px;letter-spacing:.5em;color:var(--star-g);opacity:.45;text-shadow:0 0 6px rgba(248,232,136,.5)}
.sum-box{background:rgba(6,12,24,.5);border-radius:var(--r);padding:11px 14px;margin-bottom:12px;font-size:14px;line-height:1.78;color:var(--tx);border-left:2px solid rgba(168,216,248,.35)}
.q-disp{background:rgba(168,216,248,.05);border-radius:var(--r);padding:7px 12px;margin-bottom:11px;font-size:13px;color:var(--star-i);font-style:italic;border-left:2px solid rgba(168,216,248,.3)}
.ov-body{font-size:14px;line-height:1.85;color:var(--tx2);margin-bottom:12px}
.cri{margin-bottom:16px;padding-bottom:16px;border-bottom:1px solid var(--bd)}
.cri:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}
.crh{display:flex;align-items:baseline;gap:7px;margin-bottom:4px;flex-wrap:wrap}
.crpos{font-family:'Cinzel',serif;font-size:8.5px;color:var(--tx3);letter-spacing:.13em}
.crname{font-family:'Cinzel',serif;font-size:13px;font-weight:600;color:var(--silver2)}
.crori{font-size:10px;color:var(--tx3);font-style:italic}
.crb{font-size:13px;line-height:1.75;color:var(--tx2);margin-top:4px}
.crhook{margin-top:4px;font-size:11px;color:var(--tx3);font-style:italic}
.tag{display:inline-block;padding:2px 7px;border-radius:10px;font-size:10px;margin:2px 2px 4px 0}
.tw{background:rgba(232,120,88,.1);color:#e89070;border:1px solid rgba(232,120,88,.25)}
.tg{background:rgba(104,200,144,.1);color:#80d0a0;border:1px solid rgba(104,200,144,.25)}
.adv-sec{margin-bottom:14px}
.adv-title{font-family:'Cinzel',serif;font-size:8.5px;letter-spacing:.17em;margin-bottom:7px}
.adv-title.good{color:var(--good)}.adv-title.warn{color:var(--warn)}
.adv-item{padding:7px 0;border-bottom:1px solid var(--bd);font-size:13px;color:var(--tx2)}
.adv-item:last-child{border-bottom:none}
.adv-item strong{color:var(--tx)}

/* LINK READING */
.lr-wrap{display:flex;flex-direction:column;gap:14px}
.lr-pair{background:rgba(6,12,24,.5);border-radius:9px;padding:13px 15px;border:1px solid var(--bd);position:relative;overflow:hidden}
.lr-pair::before{content:'';position:absolute;left:0;top:0;bottom:0;width:2px;background:linear-gradient(to bottom,var(--star-i),transparent);border-radius:9px 0 0 9px}
.lr-cards{display:flex;align-items:center;gap:7px;margin-bottom:7px;flex-wrap:wrap}
.lr-badge{display:inline-flex;align-items:center;gap:3px;padding:2px 7px;background:rgba(168,216,248,.07);border:1px solid rgba(168,216,248,.2);border-radius:20px;font-family:'Cinzel',serif;font-size:9px;color:var(--silver)}
.lr-badge.rev{background:rgba(232,120,88,.07);border-color:rgba(232,120,88,.2);color:#e8a080}
.lr-arrow{font-size:11px;color:var(--tx3);opacity:.45}
.lr-type{font-family:'Cinzel',serif;font-size:8.5px;letter-spacing:.13em;color:var(--star-i);text-transform:uppercase;margin-bottom:4px;opacity:.7}
.lr-desc{font-size:13px;line-height:1.75;color:var(--tx2)}
.lr-desc strong{color:var(--tx)}
.story-box{background:linear-gradient(135deg,rgba(13,22,40,.8),rgba(21,32,56,.8));border:1px solid rgba(168,216,248,.14);border-radius:11px;padding:16px 18px;position:relative}
.story-box::before{content:'✦';position:absolute;top:-8px;left:50%;transform:translateX(-50%);font-size:13px;color:var(--star-g);text-shadow:0 0 8px rgba(248,232,136,.6);background:var(--night2);padding:0 7px}
.story-title{font-family:'Cinzel',serif;font-size:9px;letter-spacing:.18em;color:var(--star-i);text-align:center;margin-bottom:10px;text-transform:uppercase;opacity:.8}
.story-body{font-size:14px;line-height:1.85;color:var(--tx)}
.story-body em{color:var(--star-g);font-style:normal}
.lr-loading{text-align:center;padding:22px;color:var(--tx3);font-style:italic;font-size:13px}
.lr-loading::after{content:'';display:inline-block;width:4px;height:4px;border-radius:50%;background:var(--tx3);margin-left:4px;animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}

/* MACHINE PICK OVERLAY */
.mp-ov{display:none;position:fixed;inset:0;background:rgba(6,12,24,.9);z-index:600;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(12px)}
.mp-ov.open{display:flex}
.mp-box{background:rgba(13,22,40,.98);border:1px solid var(--bd2);border-radius:var(--rl);padding:24px;width:440px;max-width:100%;position:relative;box-shadow:0 12px 48px rgba(0,0,0,.7);max-height:90vh;overflow-y:auto}
.mp-title{font-family:'Cinzel',serif;font-size:15px;color:var(--silver2);margin-bottom:5px}
.mp-sub{font-size:12px;color:var(--tx3);margin-bottom:16px;font-style:italic}
.num-row{display:flex;gap:10px;margin:12px 0;justify-content:center;flex-wrap:wrap}
.ni-wrap{display:flex;flex-direction:column;align-items:center;gap:3px}
.ni-lbl{font-family:'Cinzel',serif;font-size:8.5px;color:var(--tx3);letter-spacing:.1em}
.ni{width:60px;padding:8px 4px;text-align:center;background:rgba(6,12,24,.7);border:1px solid var(--bd2);border-radius:var(--r);color:var(--tx);font-family:'Noto Sans SC','Inter',sans-serif;font-size:18px;outline:none;transition:border-color .2s}
.ni:focus{border-color:var(--star-i)}
.ni.has{border-color:var(--star-g);color:var(--star-g)}

/* SHUFFLE STAGE */
.sh-stage{position:relative;height:180px;margin:14px 0;overflow:hidden;background:rgba(6,12,24,.4);border-radius:10px;border:1px solid var(--bd)}
.sh-deck{position:absolute;bottom:30px;left:50%;transform:translateX(-50%)}
.dk-card{position:absolute;width:50px;height:83px;border-radius:4px;background:linear-gradient(135deg,#0d1a30 0%,#1a2a4a 50%,#0a1828 100%);border:1px solid rgba(168,216,248,.25);display:flex;align-items:center;justify-content:center;color:rgba(168,216,248,.35);font-size:16px;transform-origin:bottom center;transition:all .35s ease;box-shadow:0 2px 8px rgba(0,0,0,.5)}
.dk-card::after{content:'✦';position:absolute;font-size:9px;color:rgba(168,216,248,.18)}

/* FAN */
.fan-area{position:absolute;bottom:20px;left:50%;transform:translateX(-50%)}
.fan-c{position:absolute;bottom:0;transform-origin:bottom center;cursor:pointer;transition:all .5s cubic-bezier(.22,.68,0,1.1)}
.fan-c:hover .fan-img{box-shadow:0 0 14px rgba(248,232,136,.5)}
.fan-img{width:50px;height:83px;border-radius:4px;border:1px solid var(--bd2);background:linear-gradient(135deg,#0d1a30,#1a2a4a);display:flex;align-items:center;justify-content:center;font-size:16px;color:rgba(168,216,248,.5);overflow:hidden}
.fan-img img{width:100%;height:100%;object-fit:cover}
.fan-c.fan-sel .fan-img{border:2px solid var(--star-g);box-shadow:0 0 16px rgba(248,232,136,.55)}
.fan-num{position:absolute;top:-14px;left:50%;transform:translateX(-50%);font-family:'Cinzel',serif;font-size:8px;color:var(--star-g);white-space:nowrap;opacity:.8}

/* SHUFFLE ANIMATION */
@keyframes shL{0%{transform:translateX(0) rotate(0)}50%{transform:translateX(-35px) rotate(-14deg)}100%{transform:translateX(0) rotate(0)}}
@keyframes shR{0%{transform:translateX(0) rotate(0)}50%{transform:translateX(35px) rotate(14deg)}100%{transform:translateX(0) rotate(0)}}
.shuffling .dk-card:nth-child(odd){animation:shL .38s ease-in-out infinite alternate}
.shuffling .dk-card:nth-child(even){animation:shR .38s ease-in-out infinite alternate}

/* MODAL */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(6,12,24,.85);z-index:1000;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(10px)}
.modal-bg.open{display:flex}
.modal-box{background:rgba(13,22,40,.97);border:1px solid var(--bd2);border-radius:var(--rl);padding:24px;width:360px;max-width:100%;max-height:88vh;overflow-y:auto;animation:mIn .3s cubic-bezier(.22,.68,0,1.15);scrollbar-width:thin;scrollbar-color:var(--bd2) transparent;box-shadow:0 12px 48px rgba(0,0,0,.7);position:relative}
.modal-box::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:38%;height:1px;background:linear-gradient(to right,transparent,rgba(168,216,248,.55),transparent)}
@keyframes mIn{from{opacity:0;transform:translateY(22px) scale(.93);filter:blur(4px)}to{opacity:1;transform:none;filter:blur(0)}}
.m-iw{text-align:center;margin-bottom:14px}
.m-iw img{width:86px;height:144px;object-fit:cover;border-radius:6px;border:1px solid var(--bd2);box-shadow:0 8px 24px rgba(0,0,0,.6)}
.m-iw img.rev{transform:rotate(180deg)}
.m-sym{font-size:44px;margin-bottom:6px;text-align:center}
.m-name{font-family:'Cinzel',serif;font-size:16px;font-weight:600;color:var(--silver2);text-align:center;margin-bottom:3px;letter-spacing:.06em}
.m-ori{text-align:center;font-size:11px;color:var(--tx3);margin-bottom:14px;font-style:italic}
.m-sep{height:1px;background:linear-gradient(to right,transparent,var(--bd2),transparent);margin:10px 0}
.m-st{font-family:'Cinzel',serif;font-size:8.5px;letter-spacing:.16em;color:var(--tx3);text-transform:uppercase;margin-bottom:4px}
.m-sb{font-size:13px;line-height:1.7;color:var(--tx2);margin-bottom:10px}
.m-close{width:100%;margin-top:8px;padding:8px;border:1px solid var(--bd);border-radius:var(--r);background:transparent;cursor:pointer;font-family:'Cinzel',serif;font-size:10px;letter-spacing:.1em;color:var(--tx3);transition:all .2s}
.m-close:hover{border-color:rgba(168,216,248,.3);color:var(--silver)}

/* FOOTER */
.footer{text-align:center;padding:44px 16px 16px;color:var(--tx3);font-size:12px;font-style:italic}
.foot-orn{margin-bottom:10px;font-size:14px;color:var(--star-g);letter-spacing:.5em;text-shadow:0 0 8px rgba(248,232,136,.5)}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bd);border-radius:2px}
</style>
</head>
<body>

<!-- LANG SWITCH -->
<div class="lang-btn">
  <button class="lp on" id="lp-zh" onclick="setLang('zh')">中文</button>
  <button class="lp" id="lp-en" onclick="setLang('en')">EN</button>
</div>

<div class="app">
  <!-- HEADER -->
  <header class="hd">
    <div class="hd-orn" data-i18n="orn">✦ &nbsp; Waite Tarot &nbsp; ✦</div>
    <h1 class="hd-title" data-i18n="title">韦特塔罗解读</h1>
    <p class="hd-sub" data-i18n="sub">塔罗不是算命，是照镜子——看清当下的能量状态</p>
  </header>

  <!-- QUESTION -->
  <div class="q-wrap">
    <div class="lbl" data-i18n="q_lbl">你的问题</div>
    <input class="q-input" id="q-input" type="text" data-i18n-ph="q_ph">
  </div>

  <!-- ASPECT + SPREAD ROW -->
  <div class="cfg-row">
    <div class="cfg-g">
      <div class="lbl" data-i18n="asp_lbl">解读方向</div>
      <div class="pills" id="aspect-pills">
        <button class="pill on" data-a="综合" onclick="setAspect('综合')" data-i18n-self="asp_all">综合</button>
        <button class="pill" data-a="感情" onclick="setAspect('感情')" data-i18n-self="asp_love">感情</button>
        <button class="pill" data-a="事业" onclick="setAspect('事业')" data-i18n-self="asp_career">事业</button>
        <button class="pill" data-a="财富" onclick="setAspect('财富')" data-i18n-self="asp_wealth">财富</button>
        <button class="pill" data-a="人际" onclick="setAspect('人际')" data-i18n-self="asp_social">人际</button>
      </div>
    </div>
  </div>

  <!-- SPREAD SELECTOR -->
  <div class="spread-selector">
    <div class="lbl" data-i18n="spread_lbl">牌阵</div>
    <div class="spread-grid" id="spread-selector-grid"></div>
  </div>

  <!-- ACTION BUTTONS -->
  <div class="btn-row">
    <button class="btn btn-p" onclick="drawCards()"><span>✦</span><span data-i18n="btn_rand">随机抽牌</span></button>
    <button class="btn btn-g" onclick="openMachinePick()"><span>✧</span><span data-i18n="btn_mach">机选抽牌</span></button>
    <button class="btn btn-s" onclick="openCardLib()"><span>☰</span><span data-i18n="btn_man">牌意解读</span></button>
  </div>

  <!-- 牌意解读库（无选牌功能，纯浏览） -->
  <div class="picker-wrap" id="picker-wrap">
    <div class="picker-hd">
      <input class="p-search" id="p-search" type="text" data-i18n-ph="p_search" oninput="renderCardLib(this.value)">
      <button class="ot" onclick="closeCardLib()" style="padding:4px 14px;border-color:rgba(232,120,88,.4);color:var(--warn)" data-i18n-self="close">关闭</button>
    </div>
    <div class="p-grid" id="p-grid"></div>
  </div>

  <!-- SPREAD DISPLAY -->
  <div class="spread-display" id="spread-display">
    <div class="spread-name-lbl" id="spread-name-lbl"></div>
    <div class="spread-info-bar" id="spread-info-bar"></div>
    <div id="ic-layout-wrap">
      <div class="ic-wrap" id="ic-wrap"></div>
    </div>
  </div>

  <!-- ADD BAR -->
  <div class="add-bar" id="add-bar">
    <span style="font-size:11px;color:var(--tx3);white-space:nowrap;font-family:'Cinzel',serif;letter-spacing:.08em" data-i18n="clarify">澄清牌</span>
    <div class="ab-div"></div>
    <input type="text" id="clarify-q" data-i18n-ph="cq_ph">
    <div class="ab-div"></div>
    <button class="mb" onclick="addClarify()" data-i18n-self="c_rand">随机抽</button>
    <button class="mb" onclick="openClarifyPick()" data-i18n-self="c_man">手动选</button>
  </div>

  <!-- READING PANEL -->
  <div class="rp" id="rp">
    <div class="rtabs">
      <div class="rtab on" onclick="showTab('ov')" data-i18n-self="tab_ov">整体解读</div>
      <div class="rtab" onclick="showTab('cards')" data-i18n-self="tab_cards">逐张分析</div>
      <div class="rtab" onclick="showTab('link')" data-i18n-self="tab_link">关联解读</div>
      <div class="rtab" onclick="showTab('adv')" data-i18n-self="tab_adv">行动建议</div>
    </div>
    <div class="rc" id="rc"><div class="rph" data-i18n="rph">抽牌后查看解读</div></div>
  </div>

  <div class="footer">
    <div class="foot-orn">✦ &nbsp; ✧ &nbsp; ✦ &nbsp; ✧ &nbsp; ✦</div>
    <span data-i18n="footer">塔罗是工具，不是命运判决书 · 行动权永远在你手里</span>
  </div>
</div>

<!-- CLARIFY PICK MODAL — 所有牌背面 -->
<div class="mp-ov" id="clarify-pick-ov" onclick="if(event.target===this)closeClarifyPick()">
  <div class="mp-box" style="width:520px;max-height:80vh;overflow-y:auto">
    <div class="mp-title" data-i18n="cp_title">选择澄清牌</div>
    <div class="mp-sub" id="cp-sub">点击任意一张牌背，或输入数字 1-78</div>
    <div style="display:flex;gap:8px;margin:12px 0;align-items:center">
      <input id="cp-num-input" type="number" min="1" max="78" placeholder="输入 1-78"
        style="width:110px;padding:7px 10px;background:rgba(6,12,24,.7);border:1px solid var(--bd2);border-radius:var(--r);color:var(--tx);font-size:15px;outline:none"
        oninput="cpNumChange(this)">
      <button class="btn btn-p" style="flex:1;max-width:140px" onclick="confirmClarifyNum()" id="cp-confirm-btn" disabled data-i18n-self="confirm_cp">确认抽取</button>
      <button class="btn btn-s" style="flex:1;max-width:100px" onclick="closeClarifyPick()" data-i18n-self="cancel">取消</button>
    </div>
    <!-- 78张牌背 -->
    <div id="cp-backs" style="display:flex;flex-wrap:wrap;gap:6px;justify-content:center;padding:8px 0"></div>
  </div>
</div>

<!-- 抽牌 LOADING OVERLAY -->
<div id="draw-loading" style="display:none;position:fixed;inset:0;background:rgba(6,12,24,.92);z-index:800;align-items:center;justify-content:center;flex-direction:column;gap:20px;backdrop-filter:blur(12px)">
  <div id="dl-cards" style="display:flex;gap:-20px;justify-content:center;position:relative;height:130px;width:340px"></div>
  <div style="font-family:'Cinzel',serif;font-size:13px;color:var(--star-i);letter-spacing:.2em;opacity:.8" id="dl-txt">正在洗牌</div>
  <div style="display:flex;gap:6px;margin-top:4px">
    <span class="dl-dot"></span><span class="dl-dot"></span><span class="dl-dot"></span>
  </div>
</div>

<style>
.dl-dot{width:6px;height:6px;border-radius:50%;background:var(--star-i);animation:dlPulse 1.2s ease-in-out infinite}
.dl-dot:nth-child(2){animation-delay:.2s}
.dl-dot:nth-child(3){animation-delay:.4s}
@keyframes dlPulse{0%,80%,100%{opacity:.2;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}
.dl-card-anim{position:absolute;width:58px;height:97px;border-radius:5px;background:linear-gradient(135deg,#0d1a30 0%,#1a2a4a 50%,#0a1828 100%);border:1px solid rgba(168,216,248,.3);display:flex;align-items:center;justify-content:center;font-size:20px;color:rgba(168,216,248,.4);box-shadow:0 4px 16px rgba(0,0,0,.6);transform-origin:bottom center}
@keyframes dlFlyIn{from{opacity:0;transform:translateY(-80px) rotate(var(--rot)) scale(.7)}to{opacity:1;transform:translateY(0) rotate(var(--rot)) scale(1)}}
@keyframes dlFan{from{transform:rotate(0deg)}to{transform:rotate(var(--rot))}}

/* 澄清牌背面 */
.cp-back{width:50px;height:83px;border-radius:4px;background:linear-gradient(135deg,#0d1a30,#1a2a4a,#0a1828);border:1px solid rgba(168,216,248,.25);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;color:rgba(168,216,248,.4);transition:all .18s;box-shadow:0 2px 8px rgba(0,0,0,.5)}
.cp-back:hover{border-color:var(--star-g);transform:translateY(-4px);box-shadow:0 0 12px rgba(248,232,136,.3)}
.cp-back.cp-sel{border-color:var(--star-g);background:linear-gradient(135deg,#1a1000,#2a2000);color:var(--star-g)}
</style>
<style>

  .app{padding-bottom:max(80px,calc(80px + env(safe-area-inset-bottom)))}

.p-grid,.mp-box,.modal-box,#cp-backs{-webkit-overflow-scrolling:touch}

@media(max-width:600px){

  .ic-wrap{gap:6px;padding:2px 0 8px}
  .ic{width:60px}
  .ic-img{width:50px;height:84px}
  .ic-num{font-size:7px;padding:1px 5px;max-width:68px}
  .ic-name{font-size:8px}
  .layout-cross .ic-wrap{grid-template-columns:62px 62px 62px 8px 62px;gap:2px}
  .layout-tree .ic-wrap{grid-template-columns:repeat(3,58px);gap:3px}
  .rc{padding:14px}
  .rtab{padding:9px 10px;font-size:10px}

let curSpread='three';
function buildSpreadSelector(){
  const grid=document.getElementById('spread-selector-grid');
  grid.innerHTML='';
  Object.entries(SPREADS).forEach(([key,sp])=>{
    const info=sp[curLang]||sp.zh;
    const d=document.createElement('div');
    d.className='s-card'+(key===curSpread?' on':'');
    d.onclick=()=>selectSpread(key);
    d.innerHTML=`<span class="s-card-name">${info.name}</span><span class="s-card-desc">${info.desc}</span><span class="s-card-n">${sp.n}张</span>`;
    grid.appendChild(d);
  });
}

function selectSpread(key){
  curSpread=key;
  document.querySelectorAll('.s-card').forEach((d,i)=>{
    const k=Object.keys(SPREADS)[i];
    d.classList.toggle('on',k===key);
  });
}

function getPositions(key){
  const sp=SPREADS[key]||SPREADS.three;
  return sp.positions[curLang]||sp.positions.zh;
}

//  DRAW LOADING ANIMATION
// ══════════════════════════════════════════════════════
function showDrawLoading(cb){
  const ov=document.getElementById('draw-loading');
  const cardsEl=document.getElementById('dl-cards');
  const txt=document.getElementById('dl-txt');
  ov.style.display='flex';
  cardsEl.innerHTML='';
  const msgs=['正在洗牌…','牌在思考中…','宇宙在排列…','答案浮现中…'];
  let msgIdx=0; txt.textContent=msgs[0];
  for(let i=0;i<5;i++){
    const c=document.createElement('div');c.className='dl-card-anim';
    const rot=(i-2)*12, x=(i-2)*46;
    c.style.cssText=`--rot:${rot}deg;left:calc(50% + ${x}px - 29px);animation:dlFlyIn .4s ${i*.12}s ease forwards;opacity:0`;
    c.innerHTML='✦';cardsEl.appendChild(c);
  }
  const msgTimer=setInterval(()=>{msgIdx=(msgIdx+1)%msgs.length;txt.textContent=msgs[msgIdx];},800);
  setTimeout(()=>{clearInterval(msgTimer);ov.style.display='none';cb();},3200);
}

function openCardLib(){
  document.getElementById('picker-wrap').classList.add('show');
  renderCardLib('');
  document.getElementById('p-search').value='';
}
function closeCardLib(){document.getElementById('picker-wrap').classList.remove('show');}
function renderCardLib(filter=''){
  const grid=document.getElementById('p-grid');
  grid.innerHTML='';
  ALL.filter(n=>!filter||n.includes(filter)||(EN_NAMES[n]||'').toLowerCase().includes(filter.toLowerCase())).forEach(name=>{
    const d=DB[name];
    const el=document.createElement('div');el.className='pc';el.style.cursor='pointer';
    el.onclick=()=>openCardDetail(name);
    const imgEl=makeImg(name);
    if(imgEl){imgEl.style.cssText='width:44px;height:73px;object-fit:cover;border-radius:3px;display:block';el.appendChild(imgEl);}
    else{const s=document.createElement('div');s.className='pc-sym';s.textContent=d.sym;el.appendChild(s);}
    const nm=document.createElement('div');nm.className='pc-name';nm.textContent=cardName(name);el.appendChild(nm);
    // 悬停预览
    const pv=document.createElement('div');pv.className='pc-preview';
    const pvImg=makeImg(name);
    if(pvImg){pvImg.style.cssText='width:52px;height:87px;object-fit:cover;border-radius:4px;float:left;margin:0 10px 8px 0;border:1px solid rgba(168,216,248,.2)';pv.appendChild(pvImg);}
    pv.innerHTML+=`<div class="pcpv-name">${d.sym} ${cardName(name)}</div><div class="pcpv-keys">${d.keys}</div><div style="clear:both"></div>
      <div style="display:flex;flex-direction:column;gap:5px;margin-top:6px">
        <div style="background:rgba(168,216,248,.06);border-radius:6px;padding:6px 8px;border-left:2px solid var(--star-i)"><div class="pcpv-pos-lbl">正位 · ${curAspect}</div><div class="pcpv-pos">${d.pos[curAspect]}</div></div>
        <div style="background:rgba(232,120,88,.06);border-radius:6px;padding:6px 8px;border-left:2px solid var(--warn)"><div class="pcpv-rev-lbl">逆位 · ${curAspect}</div><div class="pcpv-rev">${d.rev[curAspect]}</div></div>
        <div class="pcpv-hook">${d.hook}</div>
      </div>`;
    el.appendChild(pv);
    grid.appendChild(el);
  });
}
function openCardDetail(name){
  const d=DB[name];
  const iw=document.getElementById('m-iw'),sym=document.getElementById('m-sym');
  iw.innerHTML='';
  const img=makeImg(name);
  if(img){img.style.cssText='width:86px;height:144px;object-fit:cover;border-radius:6px;border:1px solid var(--bd2)';iw.appendChild(img);sym.style.display='none';}
  else{sym.textContent=d.sym;sym.style.display='block';}
  document.getElementById('m-name').textContent=cardName(name);
  document.getElementById('m-ori').textContent=d.keys;
  document.getElementById('m-keys').textContent='';
  document.getElementById('m-asp-lbl').textContent=`正位 · ${curAspect}`;
  document.getElementById('m-reading').innerHTML=`${d.pos[curAspect]}<hr style="border:none;border-top:1px solid var(--bd);margin:8px 0"><div style="font-size:9px;color:var(--warn);letter-spacing:.1em;margin-bottom:4px">逆位 · ${curAspect}</div>${d.rev[curAspect]}`;
  document.getElementById('m-hook').textContent=d.hook;
  document.getElementById('card-modal').classList.add('open');
}

function openClarifyPick(){
  document.getElementById('clarify-pick-ov').classList.add('open');
  const grid=document.getElementById('cp-backs');
  grid.innerHTML='';
  for(let i=1;i<=78;i++){
    const c=document.createElement('div');c.className='cp-back';c.textContent='✦';c.dataset.n=i;c.title=`第${i}张`;
    c.onclick=()=>{
      document.querySelectorAll('.cp-back').forEach(b=>b.classList.remove('cp-sel'));
      c.classList.add('cp-sel');
      document.getElementById('cp-num-input').value=i;
      document.getElementById('cp-confirm-btn').disabled=false;
    };
    grid.appendChild(c);
  }
}
function closeClarifyPick(){document.getElementById('clarify-pick-ov').classList.remove('open');}
function cpNumChange(el){
  const v=parseInt(el.value);
  const ok=v&&v>=1&&v<=78;
  document.getElementById('cp-confirm-btn').disabled=!ok;
  if(ok){
    document.querySelectorAll('.cp-back').forEach(b=>b.classList.remove('cp-sel'));
    const t=document.querySelector(`.cp-back[data-n="${v}"]`);
    if(t){t.classList.add('cp-sel');t.scrollIntoView({block:'nearest',behavior:'smooth'});}
  }
}
function confirmClarifyNum(){
  const n=parseInt(document.getElementById('cp-num-input').value);
  if(!n||n<1||n>78) return;
  const card=ALL[(n-1)%78];
  const cq=document.getElementById('clarify-q').value.trim();
  drawn.push({name:card,rev:Math.random()<.4,pos:tf('clarify_lbl',cq)});
  document.getElementById('clarify-q').value='';
  closeClarifyPick();renderCards();renderReading();
}

function drawCards(){
  const pos=getPositions(curSpread);
  const shuffled=[...ALL].sort(()=>Math.random()-.5);
  const newDrawn=pos.map((p,i)=>({name:shuffled[i],rev:Math.random()<.4,pos:p}));
  showDrawLoading(()=>{drawn=newDrawn;showCards();});
}

function setAspect(a){
  curAspect=a;
  document.querySelectorAll('#aspect-pills .pill').forEach(p=>p.classList.toggle('on',p.dataset.a===a));
  if(drawn.length>0){renderCards();renderReading();}
}

function showCards(){
  document.getElementById('spread-display').style.display='block';
  document.getElementById('add-bar').classList.add('show');
  document.getElementById('rp').classList.add('show');
  const sp=SPREADS[curSpread]||SPREADS.three;
  const info=sp[curLang]||sp.zh;
  document.getElementById('spread-name-lbl').textContent=info.name;

  // 牌阵信息栏
  const bar=document.getElementById('spread-info-bar');
  const icons={three:'✦✦✦',cross:'✛',four:'⊞',choice:'⊹',tree:'🌳',relationship:'♾'};
  const posArr=getPositions(curSpread);
  bar.innerHTML=`
    <div class="spread-info-icon">${icons[curSpread]||'✦'}</div>
    <div class="spread-info-body">
      <div class="spread-info-name">${info.name}</div>
      <div class="spread-info-desc">${info.desc}</div>
      <div class="spread-info-ref">${info.ref}</div>
      <div class="spread-info-pos">${posArr.map((p,i)=>`<span class="spread-pos-tag"><span>${i+1}</span>${p}</span>`).join('')}</div>
    </div>`;

  // 设置布局class
  const layoutWrap=document.getElementById('ic-layout-wrap');
  layoutWrap.className='';
  layoutWrap.classList.add(`layout-${curSpread}`);

  renderCards();
  renderReading();
  if(pickerOpen) togglePicker(false);
}

function renderCards(){
  const wrap=document.getElementById('ic-wrap');
  wrap.innerHTML='';

  // 二选一阵特殊布局
  if(curSpread==='choice'){
    const colA=document.createElement('div');colA.className='choice-col';
    const lblA=document.createElement('div');lblA.className='choice-col-label';
    lblA.textContent=curLang==='en'?'Path A':'选项 A';
    colA.appendChild(lblA);

    const divider=document.createElement('div');divider.className='choice-divider';

    const colB=document.createElement('div');colB.className='choice-col';
    const lblB=document.createElement('div');lblB.className='choice-col-label';
    lblB.textContent=curLang==='en'?'Path B':'选项 B';
    colB.appendChild(lblB);

    drawn.forEach((c,i)=>{
      const el=makeCardEl(c,i);
      if(i<3) colA.appendChild(el);
      else colB.appendChild(el);
    });
    wrap.appendChild(colA);
    wrap.appendChild(divider);
    wrap.appendChild(colB);
    return;
  }

  // 关系阵：第1-2张一行，第3张居中，第4-7张一行
  if(curSpread==='relationship'){
    const row1=document.createElement('div');row1.className='ic-row';
    const mid=document.createElement('div');mid.className='ic-row';
    const row2=document.createElement('div');row2.className='ic-row';
    drawn.forEach((c,i)=>{
      const el=makeCardEl(c,i);
      if(i<2) row1.appendChild(el);
      else if(i===2) mid.appendChild(el);
      else row2.appendChild(el);
    });
    wrap.appendChild(row1);wrap.appendChild(mid);wrap.appendChild(row2);
    return;
  }

  // 其余牌阵
  drawn.forEach((c,i)=>wrap.appendChild(makeCardEl(c,i)));
}

function makeCardEl(c,i){
  const d=DB[c.name];
  const el=document.createElement('div');
  el.className='ic ic-appear';
  el.style.animationDelay=(i*.07)+'s';
  el.onclick=e=>{if(!e.target.closest('.card-brief'))toggleBrief(el,i);};

  // 编号标签
  const num=document.createElement('div');num.className='ic-num';
  num.textContent=c.pos.replace(/[①②③④⑤⑥⑦⑧⑨⑩]/,'').trim()||c.pos;
  // 截短位置名
  const posShort=c.pos.length>10?c.pos.slice(0,10)+'…':c.pos;
  num.textContent=posShort;
  el.appendChild(num);

  // 图片容器
  const imgW=document.createElement('div');
  imgW.className='ic-img'+(c.rev?' rev':'');

  const img=makeImg(c.name);
  if(img){
    imgW.appendChild(img);
  } else {
    imgW.style.cssText='display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px';
    const sym=document.createElement('div');sym.style.fontSize='18px';sym.textContent=d.sym;
    const nm2=document.createElement('div');nm2.style.cssText='font-family:"Cinzel",serif;font-size:7px;color:var(--tx3);text-align:center;padding:0 3px';nm2.textContent=cardName(c.name);
    imgW.appendChild(sym);imgW.appendChild(nm2);
  }
  if(c.rev){const b=document.createElement('div');b.className='rb';b.textContent=curLang==='en'?'R':'逆';imgW.appendChild(b);}
  el.appendChild(imgW);

  const nm=document.createElement('div');nm.className='ic-name';nm.textContent=cardName(c.name);el.appendChild(nm);
  const ori=document.createElement('div');ori.className='ic-ori';
  ori.textContent=c.rev?(curLang==='en'?'Reversed':'逆位'):(curLang==='en'?'Upright':'正位');
  el.appendChild(ori);

  // 点击展开的解读小卡 — 正逆位分开展示
  const brief=document.createElement('div');brief.className='card-brief';
  const posRead=d.pos[curAspect];
  const revRead=d.rev[curAspect];
  brief.innerHTML=`
    <div class="cb-key">${d.keys.split('、').slice(0,2).join(' · ')}</div>
    <div style="margin-bottom:4px">
      <div style="font-family:'Cinzel',serif;font-size:7.5px;color:var(--star-i);letter-spacing:.08em;margin-bottom:2px">${curLang==='en'?'UPRIGHT':'正 位'}</div>
      <div class="cb-txt">${posRead}</div>
    </div>
    <div style="border-top:1px solid var(--bd);padding-top:4px">
      <div style="font-family:'Cinzel',serif;font-size:7.5px;color:var(--warn);letter-spacing:.08em;margin-bottom:2px">${curLang==='en'?'REVERSED':'逆 位'}</div>
      <div class="cb-txt" style="color:var(--tx2);opacity:.85">${revRead}</div>
    </div>
    <div class="cb-hook">${d.hook}</div>`;
  el.appendChild(brief);
  return el;
}

function toggleBrief(el,i){
  const was=el.classList.contains('expanded');
  document.querySelectorAll('.ic.expanded').forEach(e=>e.classList.remove('expanded'));
  if(!was) el.classList.add('expanded');
}

//  READING TABS

function showTab(t){
  curTab=t;
  document.querySelectorAll('.rtab').forEach((el,i)=>el.classList.toggle('on',['ov','cards','link','adv'][i]===t));
  renderReading();
}

function renderReading(){
  const rc=document.getElementById('rc');
  if(curTab==='ov') rc.innerHTML=buildOv();
  else if(curTab==='cards') rc.innerHTML=buildCards();
  else if(curTab==='link') buildLink(rc);
  else rc.innerHTML=buildAdv();
}

function buildOv(){
  const q=document.getElementById('q-input').value.trim();
  const maj=drawn.filter(c=>DB[c.name].major);
  const rev=drawn.filter(c=>c.rev).length;
  const cup=drawn.filter(c=>c.name.includes('圣杯')).length;
  const sw=drawn.filter(c=>c.name.includes('宝剑')).length;
  const wand=drawn.filter(c=>c.name.includes('权杖')).length;
  const pent=drawn.filter(c=>c.name.includes('钱币')).length;

  // 牌组能量分析（按skill规则）
  const suits=[['圣杯',cup,'情感关系是这次局势的核心，内心世界比外部行动更重要'],
               ['宝剑',sw,'有冲突、有需要沟通的事——思维和语言是这次的关键'],
               ['权杖',wand,'行动期到了，激情和意志力在驱动局面向前'],
               ['钱币',pent,'这是一个关于现实层面的局势——钱、工作、物质、落地']];
  const dominant=suits.sort((a,b)=>b[1]-a[1])[0];
  let suitMsg=dominant[1]>=2?dominant[2]:'';

  // 大卡判断（skill：大卡出现=重大课题，优先解读）
  let majorMsg='';
  if(maj.length>=3) majorMsg=`${maj.length}张大卡同时出现，这不是小事——塔罗在说这是一个命运级别的人生课题，你正站在一个重要的十字路口。`;
  else if(maj.length===2) majorMsg=`两张大卡（${maj.map(c=>c.name).join('、')}）同时出现，说明有更大的力量在介入，这个局势超出了日常层面。`;
  else if(maj.length===1) majorMsg=`大卡${maj[0].name}在牌阵中出现，它代表的是命运性的课题，是整个牌阵的锚点。`;

  // 正逆比例分析
  let flowMsg='';
  if(rev===0) flowMsg='所有牌均为正位，能量流动顺畅，方向清晰，这是一个好时机去推进。';
  else if(rev>=drawn.length*0.7) flowMsg='超过七成逆位，说明现在有很多内在阻力还没被处理——不是不能前进，是需要先向内看。';
  else if(rev>0&&rev<drawn.length*0.4) flowMsg=`${rev}张逆位，顺逆交织，前进的路上带着需要面对的功课。`;

  // 特殊牌提示（skill快速规则）
  const specials=[];
  drawn.forEach(c=>{
    if(c.name==='恋人') specials.push('⚠️ 出现了恋人牌——注意，这张牌95%情况代表三角关系或痛苦的选择，不是单纯的爱情');
    if(c.name==='宝剑10'&&!c.rev) specials.push('宝剑十正位虽然看起来沉重，但记住牌面背景永远有太阳——谷底之后必有重生');
    if(c.name==='恶魔'&&c.rev) specials.push('✅ 恶魔逆位是积极信号——你正在或即将挣脱某种束缚');
    if(c.name==='月亮'&&c.rev) specials.push('✅ 月亮逆位——真相大白的时刻，隐藏的事情即将浮出水面');
  });

  // 整体叙事
  const first=drawn[0], last=drawn[drawn.length-1];
  const rf=first.rev?DB[first.name].rev[curAspect]:DB[first.name].pos[curAspect];
  const rl=last.rev?DB[last.name].rev[curAspect]:DB[last.name].pos[curAspect];
  const narrative=`这次牌阵${q?`针对你的问题「${q}」`:''}，从<strong>${first.name}</strong>开场——${rf.slice(0,30)}。走到最后，<strong>${last.name}</strong>落定，指向${rl.slice(0,30)}。${flowMsg}`;

  return `${q?`<div class="q-disp">✦ ${q}</div>`:''}
    <div class="s-div">✦ &nbsp; ✧ &nbsp; ✦ &nbsp; ✧ &nbsp; ✦</div>
    ${majorMsg?`<div class="sum-box" style="border-color:var(--star-g)">${majorMsg}</div>`:''}
    ${suitMsg?`<div class="sum-box">${suitMsg}</div>`:''}
    <div class="ov-body">${narrative}</div>
    ${specials.map(s=>`<div class="sum-box" style="font-size:13px;margin-bottom:8px">⚡ ${s}</div>`).join('')}`;
}

function buildCards(){
  // ── 二选一专属 ─────────────────────────────────────
  if(curSpread==='choice'){
    const grpA=drawn.slice(0,3), grpB=drawn.slice(3,6);
    const scoreA=grpA.filter(c=>!c.rev||['恶魔','月亮'].includes(c.name)).length;
    const scoreB=grpB.filter(c=>!c.rev||['恶魔','月亮'].includes(c.name)).length;
    const rec=scoreA>scoreB?'牌面能量显示<strong>选项A</strong>阻力更小，流动感更好':
              scoreB>scoreA?'牌面能量显示<strong>选项B</strong>阻力更小，流动感更好':
              '两条路的能量旗鼓相当——此刻的关键不是"哪条更好"，而是"你更渴望哪一种结果"';
    const mkGroup=(grp,lbl)=>grp.map((c,i)=>{
      const d=DB[c.name];
      const posKey=c.pos.replace(/[A-B①②③]/g,'').trim();
      const reading=c.rev?d.rev[curAspect]:d.pos[curAspect];
      const isG=!c.rev||['恶魔','月亮'].includes(c.name);
      return `<div class="cri">
        <div class="crh"><span class="crpos" style="color:var(--star-g)">${lbl}</span><span class="crpos">${posKey}</span><span class="crname">${d.sym} ${cardName(c.name)}</span><span class="crori" style="color:${c.rev?'var(--warn)':'var(--star-i)'}">${c.rev?'逆':'正'}</span></div>
        <div class="crb">${reading}</div>
        <div class="crhook">${d.hook}</div>
      </div>`;
    }).join('');
    return `<div class="sum-box" style="margin-bottom:16px">${rec}</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:0 20px">
        <div><div style="font-size:10px;color:var(--star-g);letter-spacing:.12em;border-bottom:1px solid rgba(248,232,136,.2);padding-bottom:5px;margin-bottom:10px">选项 A</div>${mkGroup(grpA,'A')}</div>
        <div><div style="font-size:10px;color:var(--star-g);letter-spacing:.12em;border-bottom:1px solid rgba(248,232,136,.2);padding-bottom:5px;margin-bottom:10px">选项 B</div>${mkGroup(grpB,'B')}</div>
      </div>`;
  }

  // ── 关系阵专属分组 ──────────────────────────────────
  if(curSpread==='relationship'){
    const labels=getPositions('relationship');
    const grps=[
      {title:'双方立场',idx:[0,1]},
      {title:'关系核心结构',idx:[2,3,4]},
      {title:'期待与走向',idx:[5,6]},
    ];
    return grps.map(g=>`<div style="margin-bottom:18px">
      <div style="font-size:9px;color:var(--star-i);letter-spacing:.15em;text-transform:uppercase;margin-bottom:8px;padding-bottom:4px;border-bottom:1px solid var(--bd)">${g.title}</div>
      ${g.idx.filter(i=>drawn[i]).map(i=>{
        const c=drawn[i],d=DB[c.name];
        const isG=!c.rev||['恶魔','月亮'].includes(c.name);
        return `<div class="cri">
          <div class="crh"><span class="crpos">${labels[i]||c.pos}</span><span class="crname">${d.sym} ${cardName(c.name)}</span><span class="crori" style="color:${c.rev?'var(--warn)':'var(--star-i)'}">${c.rev?'逆位':'正位'}</span></div>
          <div class="crb">${c.rev?d.rev[curAspect]:d.pos[curAspect]}</div>
          <div class="crhook">${d.hook}</div>
        </div>`;
      }).join('')}
    </div>`).join('');
  }

  // ── 通用逐张：正位/逆位分开展示，带对比 ──────────────
  return drawn.map(c=>{
    const d=DB[c.name];
    const isG=!c.rev||['恶魔','月亮'].includes(c.name);
    return `<div class="cri">
      <div class="crh"><span class="crpos">${c.pos}</span><span class="crname">${d.sym} ${cardName(c.name)}</span><span class="crori" style="color:${c.rev?'var(--warn)':'var(--star-i)'}">${c.rev?'逆位':'正位'}</span></div>
      <div style="margin-bottom:6px"><span class="tag ${isG?'tg':'tw'}">${isG?'▲':'⚠'} ${d.keys.split('、')[0]}</span></div>
      <div style="padding:8px 10px;background:rgba(${c.rev?'232,120,88':'168,216,248'},.05);border-radius:6px;border-left:2px solid ${c.rev?'var(--warn)':'var(--star-i)'};margin-bottom:5px">
        <div style="font-size:9px;color:${c.rev?'var(--warn)':'var(--star-i)'};letter-spacing:.1em;margin-bottom:3px">${c.rev?'逆位解读':'正位解读'}</div>
        <div class="crb">${c.rev?d.rev[curAspect]:d.pos[curAspect]}</div>
      </div>
      <div style="padding:6px 10px;background:rgba(90,120,152,.08);border-radius:6px;border-left:2px solid var(--bd2);margin-bottom:5px">
        <div style="font-size:9px;color:var(--tx3);letter-spacing:.08em;margin-bottom:2px">${c.rev?'若为正位则是：':'若为逆位则是：'}</div>
        <div style="font-size:12px;color:var(--tx3)">${c.rev?d.pos[curAspect]:d.rev[curAspect]}</div>
      </div>
      <div class="crhook">${d.hook}</div>
    </div>`;
  }).join('');
}

// ── 关联解读：基于skill哲学的叙事分析 ──────────────────
function buildLink(rc){
  if(drawn.length<2){rc.innerHTML=`<div class="rph">至少抽2张牌才能进行关联解读</div>`;return;}
  rc.innerHTML=`<div class="lr-loading">正在分析牌与牌之间的能量关系</div>`;
  setTimeout(()=>{
    const q=document.getElementById('q-input').value.trim();
    const maj=drawn.filter(c=>DB[c.name].major);
    const rev=drawn.filter(c=>c.rev).length;
    const cup=drawn.filter(c=>c.name.includes('圣杯')).length;
    const sw=drawn.filter(c=>c.name.includes('宝剑')).length;

    // 整体叙事（skill哲学：先看大卡，再看牌组比例，再看正逆）
    let storyParts=[];

    // 1. 大卡优先解读
    if(maj.length>=2){
      storyParts.push(`<strong>大卡先说话：</strong>${maj.map(c=>`${c.name}（${c.rev?'逆':'正'}）`).join('与')}同时出现，这说明现在的局势不是日常层面的小事。${maj.length>=3?'三张以上大卡同时出现，是塔罗在告诉你：你正在经历一个人生的重大转折期，命运的课题比你想象的更深远。':'两张大卡之间有一种更大的力量在运作，超出了个人意志的范畴。'}`);
    }

    // 2. 特定牌组合逻辑（基于skill的组合分析）
    const comboPairs=[];
    for(let i=0;i<drawn.length-1;i++){
      for(let j=i+1;j<drawn.length;j++){
        const combo=findCombo(drawn[i],drawn[j]);
        if(combo) comboPairs.push({a:drawn[i],b:drawn[j],desc:combo});
      }
    }

    // 3. 元素冲突/共鸣分析
    if(cup>=2&&sw>=2){
      storyParts.push(`<strong>圣杯与宝剑的张力：</strong>情感（圣杯）与思维冲突（宝剑）并存在牌阵里——说明你在这个问题上，情感想要一个答案，但脑子里同时有很多分析和担忧在拉扯你。`);
    } else if(cup>=2){
      storyParts.push(`<strong>圣杯能量主导：</strong>多张圣杯在场，情感的重量非常突出。不管这个问题表面上看是什么，内心的感受才是真正需要被看见的东西。`);
    } else if(sw>=2){
      storyParts.push(`<strong>宝剑能量主导：</strong>多张宝剑出现，说明这个局面里有真实的冲突、误解或者需要做出的决断。逃避不是出路，清晰的沟通和面对才是。`);
    }

    // 4. 首末牌的"旅程"叙事
    const first=drawn[0], last=drawn[drawn.length-1];
    const posFirst=first.pos, posLast=last.pos;
    const rfirst=first.rev?DB[first.name].rev[curAspect]:DB[first.name].pos[curAspect];
    const rlast=last.rev?DB[last.name].rev[curAspect]:DB[last.name].pos[curAspect];
    if(drawn.length>=3){
      storyParts.push(`<strong>牌阵的旅程：</strong>从"${posFirst}"的<strong>${first.name}</strong>出发（${rfirst.slice(0,25)}），走到"${posLast}"的<strong>${last.name}</strong>（${rlast.slice(0,25)}）。${first.rev&&!last.rev?'能量从阻力走向顺流，是有积极走向的。':!first.rev&&last.rev?'从顺流走向内转，提示最终需要向内看而非向外推进。':'整体能量保持了一致的方向。'}`);
    }

    // 渲染
    let h=`<div class="lr-wrap">`;

    if(storyParts.length>0){
      h+=`<div class="story-box"><div class="story-title">综合叙事解读</div><div class="story-body">${storyParts.map(p=>`<p style="margin-bottom:10px">${p}</p>`).join('')}${q?`<p style="margin-top:12px;padding-top:10px;border-top:1px solid var(--bd);color:var(--star-i);font-size:13px">针对你的问题「${q}」：这个牌阵描述的能量，正是你此刻所处的真实状态。</p>`:''}</div></div>`;
    }

    // 经典组合
    if(comboPairs.length>0){
      comboPairs.forEach(({a,b,desc})=>{
        h+=`<div class="lr-pair">
          <div class="lr-cards"><span class="lr-badge${a.rev?' rev':''}">${DB[a.name].sym} ${cardName(a.name)}${a.rev?' 逆':''}</span><span class="lr-arrow">⟷</span><span class="lr-badge${b.rev?' rev':''}">${DB[b.name].sym} ${cardName(b.name)}${b.rev?' 逆':''}</span></div>
          <div class="lr-type">✦ 经典组合</div>
          <div class="lr-desc">${desc}</div>
        </div>`;
      });
    }

    // 相邻牌的能量关系（非重复组合）
    const shownPairs=new Set(comboPairs.map(p=>`${p.a.name}+${p.b.name}`));
    for(let i=0;i<Math.min(drawn.length-1,3);i++){
      const a=drawn[i],b=drawn[i+1];
      const key=`${a.name}+${b.name}`;
      if(shownPairs.has(key)) continue;
      shownPairs.add(key);
      const desc=buildAdjacentDesc(a,b);
      h+=`<div class="lr-pair">
        <div class="lr-cards"><span class="lr-badge${a.rev?' rev':''}">${DB[a.name].sym} ${cardName(a.name)}${a.rev?' 逆':''}</span><span class="lr-arrow">→</span><span class="lr-badge${b.rev?' rev':''}">${DB[b.name].sym} ${cardName(b.name)}${b.rev?' 逆':''}</span></div>
        <div class="lr-type">${a.pos} · ${b.pos}</div>
        <div class="lr-desc">${desc}</div>
      </div>`;
    }
    h+='</div>';
    rc.innerHTML=h;
  },420);
}

function buildAdjacentDesc(a,b){
  const da=DB[a.name], db=DB[b.name];
  const ra=a.rev?da.rev[curAspect]:da.pos[curAspect];
  const rb=b.rev?db.rev[curAspect]:db.pos[curAspect];
  // 大卡→小卡
  if(da.major&&!db.major) return `<strong>${a.name}</strong>是命运层面的大方向，<strong>${b.name}</strong>是你在日常层面感受到的具体现实。前者定调，后者显化。`;
  if(!da.major&&db.major) return `日常处境（${a.name}）正在被<strong>${b.name}</strong>这张大卡所映照——表面看是日常问题，实际上有更深的命运课题在背后。`;
  // 同牌组
  if(a.name[0]===b.name[0]&&!da.major&&!db.major){
    const suit=a.name.includes('圣杯')?'情感':a.name.includes('宝剑')?'冲突与思维':a.name.includes('权杖')?'行动与激情':'现实物质';
    return `两张同属${suit}领域的牌相邻，说明这个维度的能量高度集中，是这次局势中最需要关注的方向。`;
  }
  // 正逆对比
  if(!a.rev&&b.rev) return `从<strong>${a.name}</strong>（${ra.slice(0,20)}）到<strong>${b.name}逆</strong>（${rb.slice(0,20)}）——前者提供了能量，但后者出现了阻力或内转，需要处理这个障碍才能继续推进。`;
  if(a.rev&&!b.rev) return `<strong>${a.name}逆</strong>带来了阻力，但随后<strong>${b.name}正</strong>出现——说明即便有困难，局势也在向顺流方向转化。`;
  return `<strong>${a.name}</strong>（${ra.slice(0,18)}…）之后紧接着<strong>${b.name}</strong>（${rb.slice(0,18)}…），两者之间有一种因果或递进的关系。`;
}

function buildAdv(){
  const q=document.getElementById('q-input').value.trim();
  const pos=drawn.filter(c=>!c.rev||['恶魔','月亮'].includes(c.name));
  const neg=drawn.filter(c=>c.rev&&!['恶魔','月亮'].includes(c.name));

  // 基于skill的行动建议：不是翻译牌义，而是给具体方向
  let h='';
  if(q) h+=`<div class="q-disp">✦ ${q}</div>`;

  // 顺势而为：从正位牌提炼"可以做什么"
  if(pos.length>0){
    h+=`<div class="adv-sec"><div class="adv-title good">现在可以顺势推进的</div>
    ${pos.map(c=>{
      const d=DB[c.name];
      const reading=d.pos[curAspect];
      // 将解读转化为行动语言
      const action=c.rev?`${c.name}逆位虽然有阻力，但它的积极面是：${reading}`:`${c.name}告诉你：${reading}`;
      return `<div class="adv-item"><strong>${d.sym} ${cardName(c.name)}</strong><br><span style="font-size:13px;color:var(--tx2)">${action}</span></div>`;
    }).join('')}</div>`;
  }

  // 需要注意的：逆位牌给出"需要先处理什么"
  if(neg.length>0){
    h+=`<div class="adv-sec"><div class="adv-title warn">需要先看见和处理的</div>
    ${neg.map(c=>{
      const d=DB[c.name];
      const reading=d.rev[curAspect];
      return `<div class="adv-item"><strong>${d.sym} ${cardName(c.name)}（逆）</strong><br><span style="font-size:13px;color:var(--tx2)">这张牌在提醒你：${reading}——先处理这里，后面的路才会顺。</span></div>`;
    }).join('')}</div>`;
  }

  // 综合行动建议（基于整体牌面，非单张翻译）
  const maj=drawn.filter(c=>DB[c.name].major);
  const lastCard=drawn[drawn.length-1];
  const lastRead=lastCard.rev?DB[lastCard.name].rev[curAspect]:DB[lastCard.name].pos[curAspect];
  h+=`<div class="sum-box" style="margin-top:8px">
    <div style="font-size:9px;color:var(--star-g);letter-spacing:.12em;margin-bottom:5px">综合来看</div>
    <div style="font-size:14px">
      ${maj.length>0?`大卡${maj.map(c=>c.name).join('、')}出现，说明这不是一个可以随意敷衍的局面，需要认真对待。`:''}
      最后出现的<strong>${lastCard.name}</strong>（${lastCard.rev?'逆位':'正位'}）是整个牌阵的落点——它说的是：${lastRead}。
      ${rev=>rev>drawn.length/2?'整体逆位偏多，现在不是强行推进的时机，向内梳理比向外行动更有效。':'能量整体向外，可以主动推进，但要保持清醒和觉察。'}
    </div>
  </div>`;

  return h||`<div class="rph">抽牌后查看建议</div>`;
}

function buildNarrativeReading(c,d,aspect){
  const base=c.rev?d.rev[aspect]:d.pos[aspect];
  // 用画面描述包裹，让解读更有质感
  const prefix=c.rev
    ?['这张牌倒立着说——','从逆位的角度看，','牌面翻转过来，在告诉你：','反转的能量指向：']
    :['这张牌站立着说——','此刻的能量是：','牌面直接指向：',''];
  const p=prefix[Math.floor(Math.random()*prefix.length)];
  if(p) return `<em style="color:var(--tx3);font-size:11px">${p}</em><br>${base}`;
  return base;
}

function findCombo(a,b){
  const k1=`${a.name}+${b.name}`,k2=`${b.name}+${a.name}`;
  const db=curLang==='en'?COMBO_EN:COMBO_DB;
  return db[k1]||db[k2]||null;
}

function getLinkDesc(a,b){
  if(DB[a.name].major&&DB[b.name].major){
    return curLang==='en'
      ?`Two Major Arcana together — this is destiny-level energy. <strong>${EN_NAMES[a.name]||a.name}</strong> and <strong>${EN_NAMES[b.name]||b.name}</strong> are signaling a major life theme, not a minor daily matter.`
      :`两张大卡同时出现——<strong>${a.name}</strong>与<strong>${b.name}</strong>在共同指向命运课题级别的能量，这已超越日常细节。`;
  }
  if(a.rev&&b.rev){
    return curLang==='en'
      ?`Both reversed — two energies turning inward. Before pushing forward, there is significant inner resistance that needs to be acknowledged and worked through.`
      :`两张皆逆位——能量同时向内收缩，提示先向内处理阻力，而非急于向外推进。`;
  }
  const ra=a.rev?DB[a.name].rev[curAspect]:DB[a.name].pos[curAspect];
  const rb=b.rev?DB[b.name].rev[curAspect]:DB[b.name].pos[curAspect];
  return curLang==='en'
    ?`<strong>${EN_NAMES[a.name]||a.name}</strong> (${ra.slice(0,30)}…) interacts with <strong>${EN_NAMES[b.name]||b.name}</strong> (${rb.slice(0,30)}…) to shape the energy field of this reading.`
    :`<strong>${a.name}</strong>（${ra.slice(0,20)}…）与<strong>${b.name}</strong>（${rb.slice(0,20)}…）的能量在牌阵中相互作用。`;
}

function buildStory(){
  const q=document.getElementById('q-input').value.trim();
  const first=drawn[0],last=drawn[drawn.length-1];
  const rf=first.rev?DB[first.name].rev[curAspect]:DB[first.name].pos[curAspect];
  const rl=last.rev?DB[last.name].rev[curAspect]:DB[last.name].pos[curAspect];
  const rev=drawn.filter(c=>c.rev).length;
  const maj=drawn.filter(c=>DB[c.name].major).length;
  const cup=drawn.filter(c=>c.name.includes('圣杯')).length;
  const sw=drawn.filter(c=>c.name.includes('宝剑')).length;
  const wand=drawn.filter(c=>c.name.includes('权杖')).length;
  const pent=drawn.filter(c=>c.name.includes('钱币')).length;

  let tone='',tension='';
  if(curLang==='en'){
    if(cup>=2) tone='<em>Emotional energy</em> dominates this spread — ';
    else if(sw>=2) tone='<em>Mental conflict and truth-seeking</em> rule this spread — ';
    else if(wand>=2) tone='<em>Action and passion</em> drive this spread — ';
    else if(pent>=2) tone='<em>Material reality</em> is the core focus — ';
    else if(maj>=2) tone='<em>Major life themes</em> are at play — ';
    if(rev>drawn.length/2) tension='Energy turns inward; significant resistance needs clearing before moving forward.';
    else if(rev===0) tension='Energy flows freely; clear direction and good momentum.';
    else tension='Mixed energy; progress comes alongside lessons that need attention.';
    return `${tone}the reading opens with <strong>${EN_NAMES[first.name]||first.name}${first.rev?' (Rev)':''}</strong> — ${rf.slice(0,40)} — and arrives at <strong>${EN_NAMES[last.name]||last.name}${last.rev?' (Rev)':''}</strong>, pointing toward ${rl.slice(0,40)}. ${tension}${q?' The central question is: '+q:''}`;
  }
  if(cup>=2) tone='这是一个以<em>情感为核心</em>的牌阵——';
  else if(sw>=2) tone='宝剑的能量主导，<em>思维与冲突</em>是核心——';
  else if(wand>=2) tone='权杖的火元素燃烧牌阵，<em>行动与激情</em>在驱动一切——';
  else if(pent>=2) tone='钱币的大地之力稳稳托住，<em>现实与物质</em>是核心——';
  else if(maj>=2) tone='大卡的出现让牌阵升格为<em>命运课题</em>——';
  if(rev>drawn.length/2) tension='能量整体向内，有阻力在等待被看见和处理。';
  else if(rev===0) tension='能量流动顺畅，方向清晰，是推进的好时机。';
  else tension='顺逆交织，前进中带着需要处理的功课。';
  return `${tone}牌阵从<strong>${first.name}（${first.rev?'逆':'正'}）</strong>出发——${rf.slice(0,25)}——走向<strong>${last.name}（${last.rev?'逆':'正'}）</strong>所指向的${rl.slice(0,25)}。${tension}${q?` 针对你的问题"${q}"：`:''}整体而言，这是一个关于<em>${curAspect}</em>的能量故事。`;
}

function togglePicker(clarify=false){
  pickerClarify=clarify;
  if(!pickerOpen){
    pickerOpen=true;pickerSel=[];
    renderPicker('');
    document.getElementById('picker-wrap').classList.add('show');
    document.getElementById('p-search').value='';
  } else closePicker();
}
function closePicker(){pickerOpen=false;document.getElementById('picker-wrap').classList.remove('show');}

function renderPicker(filter=''){
  const grid=document.getElementById('p-grid');
  const used=pickerClarify?[]:drawn.map(c=>c.name);
  grid.innerHTML='';
  const needN=pickerClarify?1:(getPositions(curSpread).length);
  ALL.filter(n=>{
    if(used.includes(n))return false;
    if(!filter)return true;
    const nm=curLang==='en'?(EN_NAMES[n]||n):n;
    return nm.toLowerCase().includes(filter.toLowerCase());
  }).forEach(name=>{
    const isSel=pickerSel.find(s=>s.name===name);
    const d=DB[name];
    const el=document.createElement('div');
    el.className='pc'+(isSel?' sel':'');
    el.onclick=()=>togglePickerCard(name);

    // 图片
    const imgEl=makeImg(name);
    if(imgEl){imgEl.style.cssText='width:44px;height:73px;object-fit:cover;border-radius:3px;display:block';el.appendChild(imgEl);}
    else{const s=document.createElement('div');s.className='pc-sym';s.textContent=d.sym;el.appendChild(s);}

    // 牌名
    const nm=document.createElement('div');nm.className='pc-name';nm.textContent=cardName(name);el.appendChild(nm);

    // 正逆位标记
    if(isSel){
      const rv=document.createElement('div');rv.className='pc-rv';rv.textContent=isSel.rev?(curLang==='en'?'Rev':'逆'):(curLang==='en'?'Up':'正');el.appendChild(rv);
      const badge=document.createElement('div');badge.className='pc-sel-badge';badge.textContent='✓';el.appendChild(badge);
    }

    // 牌意预览浮层 — 正逆位分区展示
    const pv=document.createElement('div');pv.className='pc-preview';
    const pvImgEl=makeImg(name);
    if(pvImgEl){
      pvImgEl.style.cssText='width:52px;height:87px;object-fit:cover;border-radius:4px;float:left;margin:0 10px 8px 0;border:1px solid rgba(168,216,248,.2);flex-shrink:0';
    }
    const posLbl=curLang==='en'?`UPRIGHT · ${curAspect}`:`正位 · ${curAspect}`;
    const revLbl=curLang==='en'?`REVERSED · ${curAspect}`:`逆位 · ${curAspect}`;
    pv.innerHTML=`
      <div class="pcpv-name">${d.sym} ${cardName(name)}</div>
      <div class="pcpv-keys">${d.keys}</div>
      <div style="clear:both"></div>
      <div style="display:flex;flex-direction:column;gap:6px">
        <div style="background:rgba(168,216,248,.05);border-radius:6px;padding:6px 8px;border-left:2px solid var(--star-i)">
          <div class="pcpv-pos-lbl">${posLbl}</div>
          <div class="pcpv-pos">${d.pos[curAspect]}</div>
        </div>
        <div style="background:rgba(232,120,88,.05);border-radius:6px;padding:6px 8px;border-left:2px solid var(--warn)">
          <div class="pcpv-rev-lbl">${revLbl}</div>
          <div class="pcpv-rev">${d.rev[curAspect]}</div>
        </div>
      </div>
      <div class="pcpv-hook">${d.hook}</div>`;
    if(pvImgEl)pv.prepend(pvImgEl);
    el.appendChild(pv);

    grid.appendChild(el);
  });
  document.getElementById('p-count').textContent=tf('sel_count_f',pickerSel.length)+(needN>1?` / ${needN}`:'');
}

function togglePickerCard(name){
  const idx=pickerSel.findIndex(s=>s.name===name);
  if(idx>=0)pickerSel.splice(idx,1);
  else pickerSel.push({name,rev:pickerOrient==='逆位'});
  renderPicker(document.getElementById('p-search').value);
}

function setPickerOrient(o){
  pickerOrient=o;
  document.getElementById('ot-pos').classList.toggle('on',o==='正位');
  document.getElementById('ot-rev').classList.toggle('on',o==='逆位');
}

function updatePickerCount(){
  document.getElementById('p-count').textContent=tf('sel_count_f',pickerSel.length);
}

function clearPicker(){pickerSel=[];renderPicker(document.getElementById('p-search').value);}

function confirmManual(){
  if(pickerSel.length===0)return;
  if(pickerClarify){
    const cq=document.getElementById('clarify-q').value.trim();
    pickerSel.forEach(s=>drawn.push({name:s.name,rev:s.rev,pos:tf('clarify_lbl',cq)}));
    document.getElementById('clarify-q').value='';
  } else {
    const pos=getPositions(curSpread);
    drawn=pickerSel.slice(0,pos.length).map((s,i)=>({name:s.name,rev:s.rev,pos:pos[i]||`${i+1}`}));
    for(let i=pos.length;i<pickerSel.length;i++) drawn.push({name:pickerSel[i].name,rev:pickerSel[i].rev,pos:`${curLang==='en'?'Extra':'补充'}${i-pos.length+1}`});
  }
  pickerSel=[];closePicker();showCards();
}

function addClarify(){
  // 澄清牌从全78张中随机选取，模拟真实抽牌体验
  const card=ALL[Math.floor(Math.random()*78)];
  const cq=document.getElementById('clarify-q').value.trim();
  drawn.push({name:card,rev:Math.random()<.4,pos:tf('clarify_lbl',cq)});
  document.getElementById('clarify-q').value='';
  renderCards();renderReading();
}

function closeModal(e){if(e.target===document.getElementById('card-modal'))document.getElementById('card-modal').classList.remove('open');}

//  MACHINE PICK
// ══════════════════════════════════════════════════════
function openMachinePick(){
  const sp=SPREADS[curSpread]||SPREADS.three;
  const n=sp.n;
  const spInfo=sp[curLang]||sp.zh;
  const ordinals=curLang==='en'
    ?['1st','2nd','3rd','4th','5th','6th','7th','8th','9th','10th']
    :['第一','第二','第三','第四','第五','第六','第七','第八','第九','第十'];

  // 更新提示文字
  const subTxt=curLang==='en'
    ?`Spread: ${spInfo.name} (${n} cards) — enter ${n} numbers (1–78) you feel drawn to`
    :`牌阵：${spInfo.name}（${n}张）— 静心输入你感应到的 ${n} 个数字（1-78）`;
  document.getElementById('mp-sub-txt').textContent=subTxt;

  // 动态生成数字输入框
  machineNumbers=new Array(n).fill(null);
  const row=document.getElementById('mp-num-row');
  row.innerHTML='';
  // 超过6张时分两行
  const showN=Math.min(n,10);
  for(let i=0;i<showN;i++){
    const wrap=document.createElement('div');wrap.className='ni-wrap';
    const lbl=document.createElement('div');lbl.className='ni-lbl';
    lbl.textContent=ordinals[i]||(i+1)+'';
    const inp=document.createElement('input');
    inp.className='ni';inp.type='number';inp.min='1';inp.max='78';inp.placeholder='1~78';
    inp.dataset.idx=i;
    inp.oninput=function(){niChange(this);};
    wrap.appendChild(lbl);wrap.appendChild(inp);
    row.appendChild(wrap);
  }
  document.getElementById('btn-deal').disabled=true;
  document.getElementById('mp-ov').classList.add('open');
  buildDeckStage();
}

function closeMachinePick(){
  document.getElementById('mp-ov').classList.remove('open');
  clearInterval(shuffleTimer);
  isFanOpen=false;
}

function mpBgClick(e){if(e.target===document.getElementById('mp-ov'))closeMachinePick();}

function niChange(el){
  let v=parseInt(el.value);
  if(isNaN(v)||v<1)v=null;
  if(v&&v>78){v=78;el.value=78;}
  const idx=parseInt(el.dataset.idx||0);
  machineNumbers[idx]=v;
  el.classList.toggle('has',v!==null);
  // 扇形展开后才能翻牌，或者有任何输入也可以
  const hasAny=machineNumbers.some(n=>n!==null);
  if(isFanOpen||hasAny) document.getElementById('btn-deal').disabled=false;
}

function buildDeckStage(){
  const stage=document.getElementById('sh-stage');
  stage.innerHTML='';
  isFanOpen=false;
  const deck=document.createElement('div');
  deck.className='sh-deck';deck.id='sh-deck';
  // 15 stacked cards
  for(let i=0;i<15;i++){
    const card=document.createElement('div');
    card.className='dk-card';
    card.style.cssText=`left:${-25+i*.5}px;bottom:${i*.5}px;z-index:${i};transform:rotate(${(i-7)*.3}deg)`;
    card.innerHTML='✦';
    deck.appendChild(card);
  }
  stage.appendChild(deck);
}

function startShuffle(){
  if(shuffleTimer)clearInterval(shuffleTimer);
  isFanOpen=false;
  const deck=document.getElementById('sh-deck');
  if(!deck)return;
  deck.classList.add('shuffling');
  let count=0;
  shuffleTimer=setInterval(()=>{
    count++;
    if(count>=8){
      clearInterval(shuffleTimer);
      deck.classList.remove('shuffling');
      openFan();
    }
  },400);
}

function openFan(){
  const stage=document.getElementById('sh-stage');
  stage.innerHTML='';
  isFanOpen=true;
  // Fan out 78 cards (show 20 for performance)
  const fanArea=document.createElement('div');fanArea.className='fan-area';
  const total=20;
  const spread=140;
  for(let i=0;i<total;i++){
    const angle=-spread/2+(i/(total-1))*spread;
    const fc=document.createElement('div');fc.className='fan-c';
    const rad=angle*(Math.PI/180);
    const x=Math.sin(rad)*120;
    const y=-(Math.cos(rad)*120-120);
    fc.style.cssText=`left:${x-25}px;transform:rotate(${angle}deg) translateY(${-y}px);z-index:${i}`;
    const fi=document.createElement('div');fi.className='fan-img';fi.innerHTML='✦';
    fc.appendChild(fi);
    fanArea.appendChild(fc);
  }
  stage.appendChild(fanArea);
  document.getElementById('btn-deal').disabled=false;
}

function confirmMachine(){
  const positions=getPositions(curSpread);
  const usedNames=[];
  const newDrawn=positions.map((p,i)=>{
    let cardIdx=machineNumbers[i];
    if(!cardIdx||cardIdx<1||cardIdx>78) cardIdx=Math.ceil(Math.random()*78);
    let finalIdx=(cardIdx-1)%78;
    let attempts=0;
    while(usedNames.includes(ALL[finalIdx])&&attempts<78){finalIdx=(finalIdx+1)%78;attempts++;}
    usedNames.push(ALL[finalIdx]);
    return {name:ALL[finalIdx],rev:Math.random()<.4,pos:p};
  });
  closeMachinePick();
  showDrawLoading(()=>{drawn=newDrawn;showCards();});
}

applyI18n();
renderPicker('');
